# Project-level settings, shared by every group and subgroup.
# Subgroup settings (lineage keywords, outgroup, run overrides, ...) live next to each
# subgroup's TSV, e.g. plants_plt/solanaceae/solanaceae.yaml

source_path: /data/shared/organelle-igr   # absolute path to the source data folder (contains subfolders for each group)

tools:
  prank: ~/tools/prank-msa/src/prank
  clustalo: clustalo
  mafft: mafft
  iqtree: iqtree3

workers: 32

# Subgroups get_all() returns; each needs a <subgroup>.yaml in its folder
groups:
  plants_plt: [solanaceae, poaceae]
  #plants_mit: [solanaceae]

# Default settings; a subgroup's YAML overrides any of them (same key at its top level)
defaults:
  # 02_gene_pairs: a gene pair is kept if mean_len > min_mean_len and it is present in at
  # least max(min_genomes, min_genome_frac x subgroup size) genomes
  min_mean_len: 50
  min_genomes: 10
  min_genome_frac: 0.05

# Default run names; a subgroup's YAML can override any of them under `runs:`
runs:
  cds: v2
  mafft: v2
  iqtree: v2
  guide_trees: v2_refined
  clustalo: clustalo_v2
  prank: prank_v2